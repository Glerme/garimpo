# docker compose up -d  → sistema em http://localhost:3000
# Antes: rode `npm run setup` uma vez (gera o .env com os tokens) ou copie .env.example para .env.
services:
  sistema:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./dados/garimpo.db}
      RASTRO_URL: http://rastro:4310
      WHATSAPP_URL: http://whatsapp:4320
    ports: ["3000:3000"]
    volumes: ["dados:/app/dados"]
    restart: unless-stopped
  rastro:
    build: ./servicos/rastro
    environment:
      RASTRO_TOKEN: ${RASTRO_TOKEN}
    volumes: ["rastro:/app/.local"]
    restart: unless-stopped
  whatsapp:
    build: ./servicos/whatsapp
    environment:
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      APP_URL: http://sistema:3000
    volumes: ["sessao:/app/.sessao"]
    restart: unless-stopped
volumes:
  dados:
  rastro:
  sessao:
